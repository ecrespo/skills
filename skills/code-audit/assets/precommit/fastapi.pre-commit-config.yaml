# .pre-commit-config.yaml — FastAPI + uv
# Gate: secrets, format, lint, types, complexity, SAST, SCA. Tests/Trivy/Semgrep → CI.
# Install: uv add --dev pre-commit && uv run pre-commit install
# Update pins: uv run pre-commit autoupdate
default_language_version:
  python: python3.13
exclude: |
  (?x)^(
    \.venv/.*|
    migrations/.*|
    \.git/.*
  )$
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: "secrets: Gitleaks"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: debug-statements
      - id: check-ast
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker
        args: [--failure-threshold=warning, --ignore=DL3008]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        name: "lint: Ruff (lint + C901)"
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty-check
        name: "types: ty"
        language: system
        entry: uv run ty check app/
        pass_filenames: false
        types: [python]
        files: ^app/
  - repo: https://github.com/PyCQA/flake8
    rev: 7.2.0
    hooks:
      - id: flake8
        name: "complexity: cognitive CCR001 (max=12)"
        additional_dependencies: [flake8-cognitive-complexity==0.1.0]
        args: [--select=CCR001, --max-cognitive-complexity=12]
        files: ^app/
        exclude: ^tests/
  - repo: local
    hooks:
      - id: lizard
        name: "complexity: Lizard CCN+args+length"
        language: system
        entry: uv run lizard app/ --CCN 10 --arguments 5 --length 200 -w
        pass_filenames: false
        files: ^app/
        exclude: ^tests/
      - id: jscpd
        name: "dry: jscpd (blocks at >3% duplication)"
        language: system
        entry: npx --yes jscpd app/ --min-tokens 70 --threshold 3
        pass_filenames: false
        files: ^app/
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: "sast: Bandit (medium+)"
        additional_dependencies: ["bandit[toml]"]
        args: [-r, app/, -c, pyproject.toml, --severity-level=medium, -q]
        pass_filenames: false
        files: ^app/
        exclude: ^tests/
  - repo: local
    hooks:
      - id: pip-audit
        name: "sca: pip-audit (only if lockfile changes)"
        language: system
        entry: uv run pip-audit
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
# CI (not pre-commit): pytest --cov (threshold), semgrep p/python p/secrets p/owasp-top-ten
# p/fastapi, trivy fs + trivy image, optional mutmut.
