# .pre-commit-config.yaml — NestJS
# Node base + Nest rules (validated DTOs, injection). devDependencies:
#   eslint, typescript-eslint, prettier, eslint-plugin-security, eslint-plugin-sonarjs,
#   @darraghor/eslint-plugin-nestjs-typed, jscpd
# CI: jest --coverage (unit) + test:e2e (supertest), semgrep p/typescript, osv-scanner, trivy.
exclude: |
  (?x)^(
    node_modules/.*|
    dist/.*|
    coverage/.*|
    \.git/.*
  )$
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        exclude: tsconfig.*\.json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker
        args: [--failure-threshold=warning]
  - repo: local
    hooks:
      - id: prettier
        name: "fmt: Prettier"
        language: system
        entry: npx prettier --check
        types_or: [ts, json, yaml, markdown]
      - id: eslint
        name: "lint+sast+complexity: ESLint (security + sonarjs + nestjs-typed)"
        # eslint.config.mjs: complexity [error,10], sonarjs/cognitive-complexity [error,12],
        # security/recommended, nestjs-typed (validates DTOs with class-validator)
        language: system
        entry: npx eslint --max-warnings=0
        types_or: [ts]
      - id: tsc
        name: "types: tsc --noEmit"
        language: system
        entry: npx tsc --noEmit -p tsconfig.build.json
        pass_filenames: false
        types_or: [ts]
      - id: jscpd
        name: "dry: jscpd src/ (blocks at >3%)"
        language: system
        entry: npx jscpd src/ --min-tokens 70 --threshold 3
        pass_filenames: false
        files: ^src/
      - id: npm-audit
        name: "sca: npm audit high+ (lockfile only)"
        language: system
        entry: npm audit --omit=dev --audit-level=high
        pass_filenames: false
        files: ^(package\.json|package-lock\.json)$
