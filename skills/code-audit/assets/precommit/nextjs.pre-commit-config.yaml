# .pre-commit-config.yaml — Next.js (App Router)
# devDependencies: eslint, eslint-config-next, typescript, prettier,
#   eslint-plugin-security, eslint-plugin-sonarjs, jscpd
# CI: vitest/jest --coverage, Playwright e2e, semgrep p/nextjs p/react, osv-scanner, trivy.
# Next security caveat: nothing sensitive in NEXT_PUBLIC_*, Server Actions with zod + auth.
exclude: |
  (?x)^(
    node_modules/.*|
    \.next/.*|
    out/.*|
    coverage/.*|
    \.git/.*
  )$
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        exclude: tsconfig.*\.json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker
        args: [--failure-threshold=warning]
  - repo: local
    hooks:
      - id: prettier
        name: "fmt: Prettier"
        language: system
        entry: npx prettier --check
        types_or: [javascript, jsx, ts, tsx, json, css, markdown]
      - id: eslint
        name: "lint+sast+complexity: ESLint (next + security + sonarjs)"
        # extends eslint-config-next/core-web-vitals; adds complexity [error,10],
        # sonarjs/cognitive-complexity [error,12], security/recommended
        language: system
        entry: npx eslint --max-warnings=0
        types_or: [javascript, jsx, ts, tsx]
      - id: tsc
        name: "types: tsc --noEmit"
        language: system
        entry: npx tsc --noEmit
        pass_filenames: false
        types_or: [ts, tsx]
      - id: no-public-secrets
        name: "secrets: no sensitive material in NEXT_PUBLIC_"
        language: system
        entry: bash -c '! grep -rInE "NEXT_PUBLIC_[A-Z_]*(KEY|SECRET|TOKEN|PASSWORD)" --include="*.ts*" --include="*.js*" --include=".env*" . --exclude-dir=node_modules --exclude-dir=.next'
        pass_filenames: false
      - id: jscpd
        name: "dry: jscpd (blocks at >3%)"
        language: system
        entry: npx jscpd app/ components/ lib/ --min-tokens 70 --threshold 3
        pass_filenames: false
      - id: npm-audit
        name: "sca: npm audit high+ (lockfile only)"
        language: system
        entry: npm audit --omit=dev --audit-level=high
        pass_filenames: false
        files: ^(package\.json|package-lock\.json)$
